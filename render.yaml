services:
  - type: web
    name: hospital-billing-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace server
    startCommand: npm start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: DNS_SERVERS
        value: 8.8.8.8,1.1.1.1
