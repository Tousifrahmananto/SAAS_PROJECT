services:
  - type: web
    name: hospital-billing-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace server
    startCommand: npm start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: SERVER_URL
        value: https://hospital-billing-api-1669.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: PASSWORD_RESET_FROM
        sync: false
      - key: INVOICE_FROM
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM
        sync: false
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: SSLCOMMERZ_SANDBOX
        value: "true"
      - key: DNS_SERVERS
        value: 8.8.8.8,1.1.1.1
